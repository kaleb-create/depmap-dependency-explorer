{% extends 'base.html' %}
{% block title %}New Bet | BioForecast Arena{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Propose a Bet</h1>
  <p class="muted">A bet activates once one non-creator forecaster/admin approves within 5 days.</p>

  <form method="post" class="form-grid">
    <label>Title
      <input type="text" name="title" maxlength="220" required />
    </label>

    <label>Category (optional)
      <input type="text" name="category" maxlength="80" placeholder="FDA approval, M&A valuation, Nobel, etc." />
    </label>

    <label>Description
      <textarea name="description" rows="4" placeholder="Define exact criteria and source(s) for final resolution."></textarea>
    </label>

    <label>Market type
      <select name="market_type" id="market_type" required>
        <option value="binary">Binary (Yes / No)</option>
        <option value="numeric">Numeric (point estimate)</option>
        <option value="multiple_choice">Multiple choice</option>
      </select>
    </label>

    <label id="options_block" class="hidden">Options (one per line)
      <textarea name="options" rows="4" placeholder="Option A&#10;Option B"></textarea>
    </label>

    <label>Forecast close time
      <input type="datetime-local" name="close_at" required />
    </label>

    <label>Resolution target time
      <input type="datetime-local" name="resolve_at" required />
    </label>

    <button type="submit" class="btn-primary">Submit Proposal</button>
  </form>
</section>

<script>
const marketType = document.getElementById('market_type');
const optionsBlock = document.getElementById('options_block');
function syncOptions() {
  const show = marketType.value === 'multiple_choice';
  optionsBlock.classList.toggle('hidden', !show);
}
marketType.addEventListener('change', syncOptions);
syncOptions();
</script>
{% endblock %}
